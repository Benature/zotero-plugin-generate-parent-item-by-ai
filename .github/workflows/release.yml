name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and release Zotero plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)."
            exit 1
          fi

      - name: Build plugin
        run: npm run build

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp .scaffold/build/*.xpi release-assets/
          cp .scaffold/build/update*.json release-assets/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zotero-plugin-${{ github.ref_name }}
          path: release-assets/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

      - name: Update Zotero update manifest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view release >/dev/null 2>&1 || \
            gh release create release \
              --title "Zotero update manifest" \
              --notes "This release stores the latest Zotero update manifest."

          gh release upload release .scaffold/build/update*.json --clobber
